<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Game Over</title>
    <style>
        body {
            background-color: #f8d7da;
            color: #721c24;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .card {
            background-color: #ffffff;
            border: 2px solid #f5c6cb;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            background-color: #dc3545;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Game Over!</h1>
        <p>Suas 5 tentativas acabaram e voce foi derrotado.</p>
        <a href="/">Tentar de novo</a>
    </div>
</body>
</html>
