<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo</title>
</head>
<body>
    <h1>Jogo de Adivinhação</h1>
    <p>Escolha um número de 0 a 100 (Máximo 5 tentativas):</p>
    <form action="/guess" method="GET">
        <input type="number" name="numero" min="0" max="100" required>
        <button type="submit">Palpitar</button>
    </form>
</body>
</html>
