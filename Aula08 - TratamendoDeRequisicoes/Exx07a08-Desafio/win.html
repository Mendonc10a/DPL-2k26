<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vitoria</title>
    <style>
        body {
            background-color: #d4edda;
            color: #155724;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .card {
            background-color: #ffffff;
            border: 2px solid #c3e6cb;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            background-color: #28a745;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Voce Venceu!</h1>
        <p>Parabens! Voce decifrou o numero secreto com sucesso.</p>
        <a href="/">Jogar de novo</a>
    </div>
</body>
</html>
